<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">Lawful access workflow</title>
  <desc id="desc">Animated four-eyes lawful-access workflow: legal request, second-admin approval, scoped export with SHA-256 fingerprint, and an append-only audit trail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#20123a"/></linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2ee6a8"/><stop offset="1" stop-color="#43d9ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t{font-family:'Segoe UI',Arial,sans-serif;fill:#e9ecff}
      .muted{fill:#8d95b8}
      .card{fill:#151b35;stroke:#2c3562;stroke-width:1.4}
      .lbl{font-size:12.5px}
    </style>
  </defs>

  <rect width="1100" height="540" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="150" fill="#ff4d8d" opacity="0.05"/>
  <circle cx="980" cy="470" r="170" fill="#2ee6a8" opacity="0.05"/>

  <text x="44" y="56" class="t" font-size="27" font-weight="700">🔐 Lawful access — four eyes, full audit</text>
  <text x="44" y="82" class="t muted" font-size="14">technical administrator only · verified legal basis · minimum necessary scope</text>

  <!-- path -->
  <path d="M180 230 H 920" stroke="#2b3460" stroke-width="3"/>
  <path d="M180 230 H 920" stroke="url(#ok)" stroke-width="3" stroke-dasharray="90 650">
    <animate attributeName="stroke-dashoffset" values="740;0" dur="5.5s" repeatCount="indefinite"/>
  </path>

  <!-- steps -->
  <g>
    <!-- 1 -->
    <rect x="60" y="160" width="240" height="150" rx="16" class="card"/>
    <circle cx="92" cy="192" r="16" fill="#ff4d8d" opacity="0.18"/>
    <text x="92" y="197" class="t" font-size="13" text-anchor="middle">1</text>
    <text x="120" y="197" class="t" font-size="15" font-weight="600">Legal request</text>
    <text x="80" y="228" class="t muted lbl">case number</text>
    <text x="80" y="250" class="t muted lbl">authority + country</text>
    <text x="80" y="272" class="t muted lbl">legal basis</text>
    <text x="80" y="294" class="t" fill="#ff8ab5" font-size="12">status: pending</text>

    <!-- 2 -->
    <rect x="330" y="160" width="240" height="150" rx="16" class="card"/>
    <circle cx="362" cy="192" r="16" fill="#c45cff" opacity="0.18"/>
    <text x="362" y="197" class="t" font-size="13" text-anchor="middle">2</text>
    <text x="390" y="197" class="t" font-size="15" font-weight="600">Second-admin review</text>
    <text x="350" y="228" class="t muted lbl">a different administrator</text>
    <text x="350" y="250" class="t muted lbl">verifies authority + scope</text>
    <text x="350" y="272" class="t muted lbl">approval is audited</text>
    <text x="350" y="294" class="t" fill="#c9a6ff" font-size="12">status: approved</text>

    <!-- 3 -->
    <rect x="600" y="160" width="240" height="150" rx="16" class="card"/>
    <circle cx="632" cy="192" r="16" fill="#43d9ff" opacity="0.18"/>
    <text x="632" y="197" class="t" font-size="13" text-anchor="middle">3</text>
    <text x="660" y="197" class="t" font-size="15" font-weight="600">Scoped export</text>
    <text x="620" y="228" class="t muted lbl">account · profile · media</text>
    <text x="620" y="250" class="t muted lbl">matches · messages · swipes</text>
    <text x="620" y="272" class="t muted lbl">no passwords or tokens</text>
    <text x="620" y="294" class="t" fill="#8fe9ff" font-size="12">SHA-256 fingerprint</text>

    <!-- 4 -->
    <rect x="870" y="160" width="190" height="150" rx="16" class="card" stroke="#2ee6a8"/>
    <circle cx="902" cy="192" r="16" fill="#2ee6a8" opacity="0.2" filter="url(#glow)"/>
    <text x="902" y="197" class="t" font-size="13" text-anchor="middle">4</text>
    <text x="930" y="197" class="t" font-size="15" font-weight="600">Audit log</text>
    <text x="890" y="228" class="t muted lbl">actor · IP · request id</text>
    <text x="890" y="250" class="t muted lbl">reason · legal basis</text>
    <text x="890" y="272" class="t muted lbl">scope · hash</text>
    <text x="890" y="294" class="t" fill="#7dffc9" font-size="12">append-only</text>
  </g>

  <!-- moving shield -->
  <g>
    <circle r="7" fill="#2ee6a8" filter="url(#glow)">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M180 230 H 920"/>
    </circle>
  </g>

  <!-- bottom guarantees -->
  <g>
    <rect x="60" y="356" width="1000" height="120" rx="18" fill="#121834" stroke="#2c3562"/>
    <text x="84" y="390" class="t" font-size="15" font-weight="600">Guarantees enforced in code</text>
    <text x="84" y="420" class="t muted lbl">✓  creator cannot approve their own request when second approval is enabled</text>
    <text x="84" y="444" class="t muted lbl">✓  exports never contain password hashes, refresh tokens or verification codes</text>
    <text x="84" y="468" class="t muted lbl">✓  every read, approval and export writes one immutable audit row with its SHA-256</text>
    <rect x="850" y="380" width="180" height="8" rx="4" fill="#232c52"/>
    <rect x="850" y="380" width="40" height="8" rx="4" fill="#2ee6a8">
      <animate attributeName="width" values="20;180;20" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="44" y="516" class="t muted" font-size="11.5">Restricted capability — use only with a verified legal basis and in line with applicable data-protection law.</text>
</svg>
