name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Format check
        run: test -z "$(gofmt -l ./cmd ./internal ./tests)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/loveservice ./cmd/api

  integration:
    name: Docker stack + E2E
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ready >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs api
          exit 1
      - name: Smoke test
        run: sh scripts/smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v
