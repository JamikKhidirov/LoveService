name: loveservice

services:
  postgres:
    image: postgres:16-alpine
    container_name: love-postgres
    environment:
      POSTGRES_USER: love
      POSTGRES_PASSWORD: love
      POSTGRES_DB: love
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U love -d love"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: love-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: love-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: love-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: loveservice
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8081:8080"
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: love-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: love-media
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        VERSION: 1.2.0
        # Override with GO_VERSION=1.26 to build offline if the 1.23 tag is not cached.
        GO_VERSION: ${GO_VERSION:-1.23}
    container_name: love-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      PUBLIC_BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://love:love@postgres:5432/love?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: love.events
      KAFKA_GROUP_ID: love-notifications
      JWT_SECRET: change-me-in-production-please-32-bytes-minimum
      ACCESS_TTL: 15m
      REFRESH_TTL: 720h
      STORAGE_DRIVER: s3
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_URL: http://localhost:9000/love-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: love-media
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      MAX_UPLOAD_MB: "50"
      AUTO_APPROVE_MEDIA: "true"
      CORS_ORIGINS: "*"
      RATE_LIMIT_PER_MINUTE: "240"
      SEED_DEMO: "true"
      DAILY_LIKE_LIMIT: "100"
      DAILY_SUPERLIKE_LIMIT: "5"
      ADMIN_REQUIRE_SECOND_APPROVAL: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-LoveService <no-reply@loveservice.local>}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-15s}
      MAIL_OUTBOX_DIR: /app/mail-outbox
      FACE_VERIFY_URL: ${FACE_VERIFY_URL:-}
      FACE_VERIFY_API_KEY: ${FACE_VERIFY_API_KEY:-}
      FACE_VERIFY_THRESHOLD: ${FACE_VERIFY_THRESHOLD:-0.75}
      FACE_VERIFY_TIMEOUT: ${FACE_VERIFY_TIMEOUT:-20s}
      DOCS_DIR: /app/docs
      LOG_LEVEL: info
    volumes:
      - ./mail-outbox:/app/mail-outbox
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
